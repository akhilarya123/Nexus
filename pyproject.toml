[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "A Self-Evolving Multi-Agent Kernel for Long-Horizon Systems Exploration and Dynamic MCP Tool Synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    # --- Data Validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # --- Graph Database ---
    "neo4j>=5.19.0",

    # --- Vector Database ---
    "qdrant-client>=1.9.0",

    # --- Cache / Queue ---
    "redis>=5.0.4",
    "celery>=5.4.0",

    # --- Ollama (local LLM — replaces OpenAI/Anthropic) ---
    "ollama>=0.2.1",

    # --- Embeddings (local, no API needed) ---
    "sentence-transformers>=3.0.0",

    # --- OpenTelemetry Observability ---
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",

    # --- Async utilities ---
    "anyio>=4.3.0",
    "tenacity>=8.3.0",

    # --- Serialization ---
    "msgpack>=1.0.8",
    "orjson>=3.10.3",

    # --- Logging ---
    "structlog>=24.1.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
]

[project.scripts]
nexus = "nexus.cli:main"
nexus-health = "scripts.health_check:main"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
log_cli = true
log_level = "INFO"
